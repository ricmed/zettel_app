name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check zettel tests

      - name: Format
        run: uv run ruff format --check zettel tests

      # No secrets and no network: tests/conftest.py refuses every connection
      # outside loopback, pins LiteLLM to its bundled price map and offers an
      # offline embedding, so a test that tries to reach any host fails here.
      # The whole suite, slow tests included, in parallel and in random order;
      # fails under the coverage floor in pyproject.toml ([tool.coverage.report]).
      - name: Tests
        run: uv run pytest -q -n auto --cov --cov-report=term --cov-report=xml

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
