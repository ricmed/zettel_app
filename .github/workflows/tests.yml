name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check zettel tests

      - name: Format
        run: uv run ruff format --check zettel tests

      # No secrets and no network: tests/conftest.py refuses every connection
      # outside loopback, pins LiteLLM to its bundled price map and offers an
      # offline embedding, so a test that tries to reach any host fails here.
      # The whole suite, slow tests included, in parallel and in random order;
      # fails under the coverage floor in pyproject.toml ([tool.coverage.report]).
      - name: Tests
        run: uv run pytest -q -n auto --cov --cov-report=term --cov-report=xml

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # Points the pull request at the gold-set measurement that covers a changed
  # prompt, threshold or model (evals/measurement_map.yaml, #333). Runs nothing
  # paid and needs only PyYAML, so it does not install the project. A fork's
  # token cannot comment; the list still goes to the job summary.
  measurements:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Measurements covering this change
        run: |
          uv run --no-project --with pyyaml python -m zettel.evals.measurement_map             --base "origin/${{ github.base_ref }}" --out measurements.md
          cat measurements.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -s measurements.md ]; then
            gh pr comment "$PR" --body-file measurements.md --edit-last --create-if-none
          else
            # A previous push may have touched a measured surface; say it no longer does.
            gh pr comment "$PR" --edit-last               --body "<!-- zettel:measurement-map -->Nenhuma medição associada a esta mudança."               || true
          fi
