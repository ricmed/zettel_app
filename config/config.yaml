# ── Zettelkasten Pipeline — Configuração Principal ─────────────────────
#
# Edite os valores abaixo de acordo com seu ambiente.
# Variáveis de ambiente necessárias:
#   OPENAI_API_KEY  (se usar provider: openai)

# ── Caminhos ────────────────────────────────────────────────────────────
vault_path: ./vault
inbox_path: ./data/inbox
chroma_path: ./data/chroma
state_db_path: ./data/state.db
cache_path: ./data/cache
prompts_path: ./prompts

# ── LLM ─────────────────────────────────────────────────────────────────
llm:
  provider: openai          # openai | anthropic | ollama
  model: gpt-4o-mini        # modelo para extração/geração
  temperature: 0.15
  top_p: 0.5
  max_retries: 2

# ── Embeddings ──────────────────────────────────────────────────────────
embedding:
  provider: openai           # openai | sentence-transformers
  model: text-embedding-3-small

# ── Chunking ────────────────────────────────────────────────────────────
chunking:
  chunk_size: 1000           # tokens aproximados
  chunk_overlap: 200

# ── Linkagem / Deduplicação ─────────────────────────────────────────────
linking:
  topk: 5
  dedupe_threshold: 0.85

# ── Harvest (Deduplicação de Arquivos) ─────────────────────────────────
harvest:
  duplicate_chunk_threshold: 0.88     # similaridade minima p/ suspeita de quase-duplicata
  duplicate_sample_size: 5            # chunks amostrados do arquivo p/ checagem semantica
  # Comportamento padrao SEM interacao (--yes / --skip-duplicates / --force / scripts):
  #   skip     -> pula o arquivo suspeito e loga aviso (padrao, mais seguro)
  #   continue -> processa mesmo assim como nova fonte
  #   abort    -> interrompe o harvest inteiro
  non_interactive_duplicate_action: skip

# ── Extraction (Filtragem de Candidatos) ──────────────────────────────
extraction:
  min_relevance_score: 3
  min_thesis_words: 5
  require_anchor_quote: true
  min_definition_words: 10

# ── Gardener (MOCs) ────────────────────────────────────────────────────
gardener:
  min_cluster_size: 5
  min_notes_for_moc: 3
  domain: "Ciencia de Dados"
  strict_topics: true
  allowed_topics:
    - "Fundamentos Matematicos e Estatisticos"
    - "Programacao, Engenharia de Software e Boas Praticas"
    - "Dados: Modelagem, Qualidade e Governanca"
    - "Aquisicao, Ingestao e Integracao"
    - "Armazenamento e Arquitetura de Dados"
    - "Processamento e Computacao"
    - "Analise Exploratoria e Estatistica Aplicada"
    - "Experimentos, Produto e Tomada de Decisao"
    - "Machine Learning Classico"
    - "Aprendizado Nao Supervisionado e Representacao"
    - "Deep Learning e Modelos Neurais"
    - "NLP Moderno e LLMs"
    - "Feature Store e Engenharia de Features"
    - "MLOps e Ciclo de Vida de Modelos"
    - "Observabilidade e Confiabilidade de ML"
    - "Infraestrutura de Serving e Sistemas em Producao"
    - "Seguranca, Privacidade e Compliance"
    - "Responsible AI, Etica e Fairness"
    - "Avaliacao e Validacao"
    - "Otimizacao, Pesquisa e Modelagem Avancada"
    - "Data Visualization e Comunicacao"
    - "Operacao, Time e Gestao de Projetos"
    - "Ferramentas e Ecossistema"
    - "Dominios e Verticais"

# ── Idioma ──────────────────────────────────────────────────────────────
language: pt-BR

# ── Logging ─────────────────────────────────────────────────────────────
log_level: INFO

# ── PDF Extractor ───────────────────────────────────────────────────────
pdf_extractor: docling       # docling | pymupdf

# ── Dispositivo (GPU) ──────────────────────────────────────────────────
device: cuda                 # auto | cpu | cuda
