# ── Zettelkasten Pipeline — Configuração Principal ─────────────────────
#
# Edite os valores abaixo de acordo com seu ambiente.
# Variáveis de ambiente necessárias:
#   OPENAI_API_KEY  (se usar provider: openai)

# ── Caminhos ────────────────────────────────────────────────────────────
vault_path: ./vault
inbox_path: ./data/inbox
chroma_path: ./data/chroma
state_db_path: ./data/state.db
cache_path: ./data/cache
prompts_path: ./prompts

# ── LLM ─────────────────────────────────────────────────────────────────
llm:
  provider: openai          # openai | anthropic | ollama
  model: gpt-4o-mini        # modelo para extração/geração
  #provider: ollama
  #model: qwen3.5:4b
  temperature: 0.15
  top_p: 0.5
  max_retries: 2

# ── Embeddings ──────────────────────────────────────────────────────────
# Providers: openai | sentence-transformers | ollama
# Trocar provider ou model exige regenerar TODOS os vetores
# (`zettel reindex --force`). O CLI detecta o drift, avisa e pede confirmacao
# (ou use --yes). Apos a troca, recalibre retrieval.relevance_floor e limiares
# de dedupe se a busca degradar.
embedding:
  # provider: openai           # openai | sentence-transformers | ollama
  # model: text-embedding-3-small
  base_url: null             # opcional; ollama default http://localhost:11434/v1
  provider: ollama
  model: qwen3-embedding
  # allow_fallback: false      # true = permite default Chroma (mistura espacos — evite)

# ── Chunking ────────────────────────────────────────────────────────────
chunking:
  chunk_size: 1500           # caracteres (nao tokens)
  chunk_overlap: 400
  min_section_chars: 200     # secoes (H3+) menores que isso sao fundidas com a seguinte

# ── Linkagem / Deduplicação ─────────────────────────────────────────────
linking:
  topk: 5
  dedupe_threshold: 0.85

# ── Harvest (Deduplicação de Arquivos) ─────────────────────────────────
harvest:
  duplicate_chunk_threshold: 0.88     # similaridade minima p/ suspeita de quase-duplicata
  duplicate_sample_size: 5            # chunks amostrados do arquivo p/ checagem semantica
  # Comportamento padrao SEM interacao (--yes / --skip-duplicates / --force / scripts):
  #   skip     -> pula o arquivo suspeito e loga aviso (padrao, mais seguro)
  #   continue -> processa mesmo assim como nova fonte
  #   abort    -> interrompe o harvest inteiro
  non_interactive_duplicate_action: skip
  # Metadados bibliograficos ABNT (inferencia + LLM + prompt interativo)
  biblio_confidence_threshold: 0.7    # abaixo disso, pede confirmacao do tipo
  biblio_llm_enabled: true            # enriquece metadados via LLM apos heuristicas
  biblio_text_sample_chars: 5000      # amostra inicial enviada ao LLM

# ── Extraction (Filtragem de Candidatos) ──────────────────────────────
extraction:
  min_relevance_score: 3
  min_thesis_words: 5
  require_anchor_quote: true
  min_definition_words: 10

# ── Imagens (extracao + descricao multimodal) ─────────────────────────
images:
  enabled: true              # extrai imagens de PDF (Docling) e Markdown e as descreve
  scale: 2.0                 # images_scale do Docling
  min_width: 64              # descarta imagens menores que isso (icones/logos)
  min_height: 64
  context_chars: 600         # caracteres ao redor da imagem usados como contexto
  model: ""                  # vazio = usa llm.model (precisa ser multimodal, ex. gpt-4o-mini)

# ── Gardener (MOCs) ────────────────────────────────────────────────────
gardener:
  min_cluster_size: 5
  min_notes_for_moc: 3
  domain: "Ciencia de Dados"
  strict_topics: true
  # Taxonomia hierarquica (pilar > categoria > topicos). Categorias = whitelist do MOC.
  topics_path: ./config/moc_topics.yaml

# ── Idioma ──────────────────────────────────────────────────────────────
language: pt-BR

# ── Logging ─────────────────────────────────────────────────────────────
log_level: INFO

# ── PDF Extractor ───────────────────────────────────────────────────────
pdf_extractor: docling       # docling | pymupdf

# ── Dispositivo (GPU) ──────────────────────────────────────────────────
device: cuda                 # auto | cpu | cuda
