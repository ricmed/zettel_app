# ── Zettelkasten Pipeline — Configuração Principal ─────────────────────
#
# FONTE OPERACIONAL UNICA: edite este arquivo. zettel/config.py e o schema
# Pydantic (tipos, validators) e so preenche chave ausente / YAML faltando
# (fallback de fabrica + testes com AppConfig()).
#
# Variaveis de ambiente (.env, nao este arquivo):
#   OPENAI_API_KEY      provider openai / gateways OpenAI-compatible
#   ANTHROPIC_API_KEY   provider anthropic
#   GOOGLE_API_KEY      provider gemini
#   DEEPSEEK_API_KEY    provider deepseek

# ── Caminhos ────────────────────────────────────────────────────────────
vault_path: ./vault                 # vault Obsidian (00_Inbox … 90_Assets)
inbox_path: ./data/inbox            # drop zone de PDF/Markdown para harvest
chroma_path: ./data/chroma          # indice vetorial persistente
state_db_path: ./data/state.db      # SQLite (estado, FTS5, grafo, cache LLM)
cache_path: ./data/cache            # cache intermediario (ex. checkpointer article)
prompts_path: ./prompts             # templates .md dos prompts

# ── LLM ─────────────────────────────────────────────────────────────────
# Knobs de amostragem sao globais. Cada fase declara provider + model + base_url
# e thinking (sem heranca de um modelo unico). Embedding continua no bloco `embedding:`.
# Providers: openai | anthropic | ollama | gemini | openrouter | opencode | deepseek
# thinking: null = default do vendor; false/0/none = off; true | minimal|low|medium|high | budget (tokens)
llm:
  temperature: 0.20         # 0 = mais deterministico; >0 aumenta variacao
  top_p: 0.5                # nucleus sampling encaminhado a get_llm (LangChain)
  max_retries: 2            # tentativas extras da mesma chamada HTTP; esgotadas => a fase para (fail-fast)
  prompt_cache: true        # layout System+Human + hints Anthropic; ≠ llm_cache SQLite
  harvest:
    provider: openai
    model: gpt-6-luna      # bibliografia ABNT no harvest
    base_url: null
    temperature: null       # null = herda llm.temperature
    thinking: none
  extract:
    provider: gemini
    model: gemini-3.5-flash-lite  # notas de literatura (Prompt 1); escolhido contra o gold set humano (ADR-050)
    base_url: null
    temperature: 0.1        # extracao estruturada: contrato fechado, cache determinístico
    thinking: null          # default do vendor: e a condicao medida no ADR-050
  review:
    provider: openai
    model: gpt-4o-mini     # dedupe; #273: luna 24/42 vs mini 25/42 (p=1). Contrato 23/42. Mini fica.
    base_url: null
    temperature: null       # null = herda llm.temperature
    thinking: null
  connect:
    provider: gemini
    model: gemini-3.1-flash-lite      # notas permanentes (Prompt 2)
    base_url: null
    temperature: 0.15       # null = herda llm.temperature
    thinking: false          # Gemini 3 costuma ligar thinking no vendor; false desliga
  garden:
    provider: openai
    model: gpt-6-luna      # MOCs taxonomicos e hub
    base_url: null
    temperature: null       # null = herda llm.temperature
    thinking: none
  ask:
    provider: deepseek
    model: deepseek-v4-flash      # zettel ask
    base_url: https://api.deepseek.com
    temperature: null       # null = herda llm.temperature
    thinking: null
  article:
    provider: deepseek
    model: deepseek-v4-flash      # zettel article (todos os nos)
    base_url: https://api.deepseek.com
    temperature: null       # null = herda llm.temperature (nos individuais podem sobrescrever em codigo)
    thinking: null
  images:
    provider: openai
    model: gpt-6-luna      # descricao multimodal (precisa ser vision)
    base_url: null
    temperature: null       # null = herda llm.temperature
    thinking: none
  summarize:
    provider: openai
    model: gpt-6-luna      # resumo de capitulo e de fonte (zettel summarize)
    base_url: null
    temperature: 0.0        # saida estruturada: contrato fechado, cache determinístico
    thinking: none

# ── Embeddings ──────────────────────────────────────────────────────────
# Providers: openai | sentence-transformers | ollama
# Trocar provider ou model exige regenerar TODOS os vetores
# (`zettel reindex --force`). O CLI detecta o drift, avisa e pede confirmacao
# (ou use --yes). Apos a troca, recalibre retrieval.relevance_floor e limiares
# de dedupe se a busca degradar.
embedding:
  # provider: openai           # openai | sentence-transformers | ollama | gemini
  # model: text-embedding-3-small
  # provider: gemini           # GOOGLE_API_KEY (ou GEMINI_API_KEY) no .env
  # model: gemini-embedding-001  # MRL 768/1536/3072; query usa RETRIEVAL_QUERY
  provider: gemini
  model: gemini-embedding-2
  # MRL: truncar vetor. null = nativo (qwen3-embedding 8B = 4096).
  # ollama: langchain_ollama (API nativa). openai: text-embedding-3-* via EF Chroma.
  # gemini: langchain_google_genai; vetores re-normalizados (norma 1) no adaptador.
  # 1024 = bom custo-beneficio. Trocar dimensions exige zettel reindex --force.
  dimensions: 1536
  base_url: null             # ollama: default http://localhost:11434 (sem /v1)
  allow_fallback: false      # true = default Chroma 384-d (mistura espacos — evite)

# ── Chunking ────────────────────────────────────────────────────────────
# Tamanhos em caracteres (nao tokens). Entram no hash de paging; mudar
# re-chunka fontes se o harvest/rechunk rodar de novo.
chunking:
  chunk_size: 2500           # alvo do splitter LangChain apos fusao de secoes
  chunk_overlap: 400         # sobreposicao entre chunks consecutivos
  min_section_chars: 200     # secoes (H3+) menores sao fundidas com a seguinte
  min_chunk_chars: 200       # pedacos do splitter menores sao fundidos no anterior
  # Um fence e a prosa que o introduz/comenta sao uma unidade: cortar na borda
  # do fence deixa o codigo sem explicacao e a explicacao sem codigo (ambos
  # viram 'fragmented'/'narrative' no extract). Secao com fence cujo total cabe
  # em chunk_size * slack fica inteira num chunk; acima disso o corte volta a
  # acontecer, mas a prosa orfa e colada no fence vizinho. 1.0 = comportamento
  # antigo (sempre cortar na borda).
  fence_section_slack: 1.5

# ── Linkagem / Deduplicação ─────────────────────────────────────────────
linking:
  topk: 5                    # default do Retriever e RAG de connect/sync (CLI pode sobrescrever)
  dedupe_threshold: 0.85     # cosseno (ADR-058). Valor declarado mantido; medicao em docs/artigo/03-review.md §4.7
  dedupe_note_chars: 6000    # teto por nota existente no prompt de dedupe (#209); acima de qualquer nota
  rag_note_chars: 150        # por nota vizinha no Prompt 2 do connect; recorte historico ate a medicao de #212
  preflight_output_tokens_per_note: 1200  # alvo de saida por nota no pre-voo de custo (nao e teto)
  distant_analogy_topk: 5    # busca secundaria do connect (fora do bucket taxonomico)
  distant_analogy_min_similarity: -0.20  # cosseno; era 0.40 na escala (1+cos)/2 (ADR-058). Piso LOCAL
  # Corroboracao entre fontes: mesma ideia em source_id diferentes vira duas ZTL
  # ligadas por `corroborates`, em vez de uma nota so. Derivada dos hits que o
  # Retriever ja trouxe no connect — nao custa embedding nem chamada de LLM.
  corroborates_min_similarity: 0.76  # cosseno; corte #226 em gemini-embedding-2@1536 (lado consulta). 0.88 na escala (1+cos)/2, convertido por ADR-058. Outro modelo exige nova medicao.
  corroborates_max_edges: 3  # teto de arestas de corroboracao por nota
  llm_edges: accept  # accept | propose. LLM nao entra no grafo ate a fila.
  prompt2_mode: combined  # combined | split. split espera a regra #288.
  write_source_chars: 4000
  thesis_drift_min_similarity: 0.0
  # Cota de sementes da mesma fonte no connect. 0 = desligada. O ask nao usa.
  # Ligar espera a regra em evals/preregistration/285-connect-rag-diversidade.md.
  seed_same_source_max: 0
  graph_hub_repeat_limit: 0  # vizinha repetida em N contextos recentes sai; 0 = desligado
  # Bloco do connect (linking.graph_expansion). O ask le retrieval.graph_expansion.
  # Os numeros copiam o ask ate evals/preregistration/285-connect-rag-diversidade.md.
  graph_expansion:
    enabled: true
    max_hops: 5
    decay: 0.2
    max_neighbors: 16
    relation_weights:
      contradicts: 1.0
      extends: 0.9
      depends_on: 0.9
      supports: 0.8
      exemplifies: 0.7
      related: 0.5
      corroborates: 0.45
      manual: 0.95

# ── Harvest (Deduplicação de Arquivos + ABNT) ──────────────────────────
harvest:
  # Camada 5 (similaridade semantica). Desligada: manter o indice-alvo exige
  # embedar todo chunk de toda fonte, e as camadas 3 e 4 (DOI/ISBN, titulo+autor)
  # ja cobrem material catalogado sem limiar para calibrar. Governa escrita E
  # leitura juntas — consultar um indice incompleto daria falso negativo mudo.
  # Ligar exige repovoar: `zettel reindex --collection chunks`.
  semantic_duplicate_enabled: false
  duplicate_chunk_threshold: 0.76     # cosseno; era 0.88 na escala (1+cos)/2 (ADR-058). Camada 5 desligada.
  duplicate_sample_size: 5            # chunks amostrados do arquivo p/ checagem semantica
  # Sem interacao (--yes / --skip-duplicates / --force / scripts):
  #   skip     -> pula o arquivo suspeito e loga aviso (mais seguro)
  #   continue -> processa mesmo assim como nova fonte
  #   abort    -> interrompe o harvest inteiro
  non_interactive_duplicate_action: skip
  # Mesmo caminho no inbox, bytes diferentes. skip deixa a fonte como esta;
  # update regrava essa fonte; new cria outra e o caminho passa a aponta-la.
  modified_file_action: skip
  # Metadados bibliograficos ABNT (heuristicas + LLM + prompt interativo)
  biblio_confidence_threshold: 0.7    # abaixo disso, pede confirmacao do tipo
  biblio_llm_enabled: true            # enriquece metadados via LLM apos heuristicas
  biblio_text_sample_chars: 5000      # amostra inicial (capa/folha de rosto) enviada ao LLM

# ── Extraction (Filtragem de Candidatos a ZTL) ─────────────────────────
extraction:
  min_relevance_score: 3     # candidatos com relevance_score abaixo sao descartados (1-5)
  min_thesis_words: 5        # palavras minimas no campo thesis
  require_anchor_quote: true # descartar se anchor_quote vazio
  min_definition_words: 10   # palavras minimas no campo definition
  verify_anchor_quote: true      # checa faixa de palavras e se a citacao existe no chunk
  anchor_quote_min_ratio: 0.85   # cobertura minima na checagem fuzzy (tolera elipse editorial)
  anchor_quote_min_words: 10     # faixa de palavras que o prompt ja exige
  anchor_quote_max_words: 25
  # Piso e teto nao sao simetricos (issue #153). Abaixo do piso nao ha citacao a
  # julgar. Acima do teto ha citacao, so mais longa que o pedido -- e a contagem
  # e apenas um proxy do que `quote_is_grounded` mede de fato. Descartar o
  # candidato inteiro por duas palavras a mais troca erro de forma por perda de
  # conteudo, entao o teto efetivo e max_words * tolerance (25 * 1.5 = 37) e so
  # uma "citacao" do tamanho de um paragrafo e recusada. 1.0 = corte rigido.
  anchor_quote_max_words_tolerance: 1.5
  preflight_output_tokens_per_chunk: 800  # alvo de saida por chunk no pre-voo de custo (nao e teto)

# ── Literature Review (aprovacao seletiva de LIT por chunk) ───────────
# review_confidence foi refeita na issue #152. A formula da #59 usava 40%
# do peso em contagem de palavras da definicao; medido no corpus, o portao
# equivalia a "relevance_score == 4 E definicao >= 48 palavras" -- um chunk
# reprovou com 47.0 palavras contra 47.5 exigidas. Pior: no piso do filtro
# (relevance_score == min_relevance_score) o teto era 0.70 contra limiar
# 0.75, entao nenhum chunk rel-3 podia auto-aprovar, por melhor que fosse.
#
# A formula atual tem dois termos, nenhum deles um comprimento:
#   0.50 relevancia  -- unico campo que julga o CONCEITO. O piso do filtro
#                       vale 0.6 do termo (nao 0): o prompt manda escolher
#                       o nivel menor em duvida e reserva 5 para ideias
#                       fundamentais raras, entao rel==piso e "valido mas
#                       nao surpreendente", nao "sem valor".
#   0.50 integridade -- fracao dos candidatos que o filtro deterministico
#                       manteve. Filtro derrubando candidato = olho humano.
#
# O limiar NAO e um percentil: 0.75 fica logo abaixo de 0.80, que e o que
# um chunk impecavel tira no piso de relevancia. Assim todo chunk sem
# defeito detectavel auto-aprova e todo chunk com defeito (filtro derrubou
# candidato) cai para revisao humana -- e cada
# reprovacao tem causa nomeavel. Um percentil garantiria taxa fixa de
# rejeicao independente da qualidade, que e a numerologia removida aqui.
# Mexer nos pesos exige rodar scripts/calibrate_review_confidence.py e
# conferir a tabela de alcancabilidade (docs/adrs/RUNBOOK.md).
#
# Distribuicao medida (1 fonte, 13 chunks pontuados -- default provisorio,
# nao calibracao): antes min 0.599 / mediana 0.746 / max 0.810, 46%
# aprovados; depois min 0.800 / mediana 0.900 / max 0.900, 100% aprovados
# (o corpus nao tem defeito para o portao pegar). O corte muito baixo 0.4
# vive em review.py (chunk rejeitado=0.1, aceito sem candidato=0.2 --
# ambos abaixo, corretamente).
literature_review:
  auto_approve_min_confidence: 0.75  # logo abaixo de 0.80 = chunk impecavel no piso (issue #152)
  batch_sample_size: 20              # max drafts de baixa confianca listados no review interativo
  drafts_subdir: 00_Inbox/Review     # relativo ao vault; drafts antes da promocao para 20_Literature

# ── Imagens (extracao no harvest + descricao multimodal) ──────────────
images:
  enabled: true              # extrai imagens de PDF (Docling) e Markdown e as descreve
  scale: 2.0                 # images_scale do Docling
  min_width: 64              # descarta imagens menores (icones/logos)
  min_height: 64
  context_chars: 600         # caracteres ao redor da imagem usados como contexto
  # Identidade vision: llm.images (provider + model + base_url)
  # Visao consome TPM rapido; pacing + retry evitam marcar 429 como failed:
  min_interval_seconds: 0.7  # pausa minima entre chamadas de descricao
  rate_limit_max_retries: 8  # tentativas por imagem em rate limit
  rate_limit_backoff_max: 60 # teto de espera (s) entre retries
  rate_limit_abort_after: 5  # falhas 429 consecutivas (apos retries) => para o lote

# ── Fórmulas Matemáticas ────────────────────────────────────────────────
# Enriquecimentos do Docling no harvest de PDF (Markdown nativo ja traz os dois como
# texto). Formulas e codigo usam o mesmo modelo local, CodeFormulaV2: baixado do
# Hugging Face na primeira colheita e mais lento que a conversao sem ele. Mudar
# qualquer um altera o texto extraido e, portanto, os chunk_id de fontes recolhidas.
formulas:
  enabled: true              # regiao de formula vira LaTeX no texto (sem: <!-- formula-not-decoded -->)

# ── Código ──────────────────────────────────────────────────────────────
code:
  enabled: true              # bloco de codigo do PDF decodificado como texto

# ── Dominio do acervo (prompts de extract/connect/garden + few-shots) ──
domain:
  name: "Ciencia de Dados e Filosofia"  # preenche {domain} nos 4 prompts
  examples_path: ./config/domain_examples.yaml  # few-shots dos dois dominios (T2)

# ── Gardener (MOCs taxonomicos; zettel garden) ─────────────────────────
gardener:
  min_cluster_size: 5                  # notas minimas para tentar clusterizar; o HDBSCAN usa max(este, min_notes_for_moc)
  min_notes_for_moc: 10                 # cluster menor que isso nao vira MOC
  strict_topics: true                  # rejeitar topic fora das categorias de moc_topics.yaml
  topics_path: ./config/moc_topics.yaml  # pilar > categoria > topicos; categorias = whitelist
  cluster_within_category: true        # clusteriza dentro de cada bucket da taxonomia
  category_label_template: "{pilar}: {categoria}"  # texto embeddado p/ atribuir notas
  category_label_mode: label           # label | leaves_in_label | max_leaf (#295; troca so pela regra pre-registrada)
  assign_min_similarity: null          # cosseno minimo p/ atribuir categoria; null = sem limiar; abaixo -> cluster livre
  overlap_threshold: 0.4               # fracao das entradas de uma subsecao do MOC que caem no cluster -> incremental
  graph_cohesion_enabled: true         # mede coesao via note_connections
  graph_cohesion_min_ratio: 0.0        # densidade ponderada 0..1; 0 = so log; >0 exige coesao minima p/ MOC novo
  umap_n_neighbors: null               # null = auto min(15, n-1); cluster UMAP+HDBSCAN
  hdbscan_min_samples: null            # null = default da lib HDBSCAN
  random_state: 42                     # semente do UMAP: particao reprodutivel; null = nao deterministico
  # MOCs e hubs sao portas de entrada (ADR-060): poucas notas, o resto pelo grafo.
  entry_selection: internal_degree     # internal_degree | medoid | first_in_source | relevance | corroboration (provisorio)
  max_entries_per_moc: 10              # teto de notas de entrada por MOC (e por MOC hub, contando o hub)
  max_entries_per_subsection: 5        # teto por subsecao
  min_entries_per_subtopic: 3          # k sub-clusters cabem num MOC se k*3 <= teto; senao MOC de MOCs (#296)
  model_refit_growth: 0.5              # modelo do bucket persistido (#300); reajusta se as notas novas passam de 50%
  summary_refresh_growth: 0.5          # reescreve o resumo quando as entradas crescem 50%
  # Arestas de LLM propostas (ainda nao revisadas, #279) no grafo do garden (#299).
  proposed_edge_factor: 0.5           # fracao do peso no grau/BFS dos hubs, coesao e entradas; 0 = so percorriveis
  warn_min_traversable_share: 0.5     # avisa (garden, doctor) se menos de 50% das arestas e percorrivel
  warn_min_reach: 0.5                 # avisa se menos de 50% das notas esta a 2 saltos de uma porta

# ── MOCs Hub (zettel garden --hubs) ────────────────────────────────────
# Porta de entrada tematica: ranqueia notas permanentes por grau ponderado
# em note_connections, expande vizinhanca (BFS) e gera MOC radial
# (origin=hub_pipeline, hub_note_id no frontmatter).
# Grafo: arestas percorriveis (aceitas em `zettel links`, derivadas, manuais) com peso
# cheio e arestas de LLM ainda propostas com gardener.proposed_edge_factor. Sem revisar
# a fila, os hubs saem quase so de corroborates e propostas; o relatorio avisa.
# Pesos por relacao: retrieval.graph_expansion.relation_weights.
hub_mocs:
  selection_mode: percentile       # percentile (escala com o vault) | absolute (limiar fixo)
  hub_percentile: 0.90             # modo percentile: 0.90 = top 10% por grau ponderado
  top_n_hubs: 15                   # teto de hubs processados por execucao (apos filtros/dedup)
  min_weighted_degree: 8.0         # modo absolute: grau minimo (soma dos relation_weights)
  max_hops: 2                      # profundidade BFS a partir do hub (1 = so vizinhos diretos)
  max_neighbors: 25                # teto do cluster (hub + vizinhos de maior peso BFS)
  min_neighbors: 8                 # vizinhanca minima; abaixo disso o hub e ignorado
  decay: 0.5                       # atenuacao do peso de caminho a cada hop (0.5 = metade)
  min_neighbor_weight: 0.3         # peso BFS minimo para o vizinho entrar na vizinhanca
  dedup_subset_threshold: 0.8      # se >= 80% da vizinhanca ja esta num hub maior, descarta

# ── Recuperacao hibrida (ask, article, connect RAG, sync) ──────────────
# mode hybrid = Chroma (denso) + FTS5 BM25, fundidos por RRF. vector = so Chroma.
# RRF e so posicional: o kNN sempre devolve os N mais proximos, mesmo irrelevantes.
# O relevance_floor e o piso ABSOLUTO alem do ranking. Recalibre se trocar embedding.
retrieval:
  mode: hybrid
  rrf_k: 60                        # constante canonica do Reciprocal Rank Fusion
  topic_index_boost: true          # termo do Topic Index vira semente extra (ainda passa pelo piso)
  topic_index_max_seeds: 5         # teto de notas trazidas pelo indice de topicos
  relevance_floor:
    enabled: true
    # Cosseno (ADR-058). Medido em 2026-09-06 na escala (1+cos)/2 como 0.70
    # (fora do dominio ~0.67, dentro ~0.80) e convertido por 2*s-1, sem remedir.
    # Re-medir com scripts/probe_relevance_floor.py ao trocar o embedding.
    min_vector_similarity: 0.40
    bm25_hit_bypasses_floor: true  # match BM25 forte pode dispensar a similaridade vetorial
    bm25_bypass_max_rank: 5        # bypass so se o hit BM25 estiver no top-N do pool
    # Rank e criterio RELATIVO ("foi bem entre os que casaram"); num pool de 4
    # notas, "top 5" quer dizer "todas". Cobertura e o criterio ABSOLUTO: quanto
    # da pergunta esta de fato na nota. Medido em 2026-09-09 (ADR-003 addendum):
    # fora-do-dominio no maximo 0.50, dentro-do-dominio no minimo 0.50, e uma
    # consulta de uma palavra so (sigla) marca 1.00 -- o caso de uso do bypass
    # continua intacto. 0.0 restaura o comportamento antigo (so rank).
    bm25_bypass_min_coverage: 0.5
    absolute_min_similarity: -0.70  # cosseno; era 0.15 na escala (1+cos)/2 (ADR-058)
  # Piso PROPRIO dos resumos de capitulo (ADR-047). E um objeto separado do de
  # cima porque mede outra distribuicao de texto: um resumo de capitulo e mais
  # longo e difuso que uma nota. Que os dois numeros hoje coincidam em 0.40 e
  # coincidencia de duas medicoes independentes, nao heranca.
  #
  # Medido em 2026-09-07 com scripts/probe_relevance_floor.py
  # --collection chapter_summaries, sobre 71 capitulos resumidos
  # (ollama/qwen3-embedding@1024d):
  # Medicao na escala (1+cos)/2, convertida para cosseno por 2*s-1 (ADR-058):
  #   fora-do-dominio max 0.693 -> cosseno 0.386
  #   self-match min 0.745 -> cosseno 0.490
  #   o piso 0.70 dessa escala virou 0.40, dentro de (0.386, 0.44]
  # Re-medir ao trocar o modelo de embedding: o numero nao transfere.
  chapter_floor:
    enabled: true
    min_vector_similarity: 0.40    # cosseno; medido 2026-09-07 na escala antiga como 0.70
    bm25_hit_bypasses_floor: true
    bm25_bypass_max_rank: 5
    bm25_bypass_min_coverage: 0.5  # mesma razao do piso de notas (ADR-003 addendum)
    absolute_min_similarity: -0.70  # cosseno; era 0.15 na escala (1+cos)/2 (ADR-058)
  graph_expansion:
    enabled: true                  # apos o piso, expande sementes pelas arestas tipadas
    max_hops: 5                    # saltos no grafo do ask/RAG (1 ja traz o GraphRAG leve)
    decay: 0.2                    # atenuacao do score por salto adicional
    max_neighbors: 16             # teto de vizinhos trazidos ao contexto
    # Override operacional dos pesos de aresta. Se omitido, vale DEFAULT_RELATION_WEIGHTS
    # em config.py (fallback tambem usado quando expand_notes e chamado sem pesos).
    relation_weights:
      contradicts: 1.0             # sinal que embedding nao captura (vetores proximos ≠ apoia)
      extends: 0.9
      depends_on: 0.9
      supports: 0.8
      exemplifies: 0.7
      related: 0.5                 # relacao tematica fraca
      # Peso governa TRAVESSIA, nao importancia. Baixo de proposito: o clique de
      # notas corroborantes serve ao leitor, mas encheria max_neighbors de
      # parafrases se competisse com as arestas que trazem informacao nova.
      corroborates: 0.45           # convergencia de autoria (fontes diferentes)
      manual: 0.95                 # peso quando origin=manual (wikilink no corpo)
  ask:
    topk: 45                        # notas semente do comando `zettel ask`
    max_context_notes: 75           # teto de notas montadas no contexto do LLM
    max_chars_per_note: 5000       # truncagem do corpo de cada nota no contexto
  article:
    topk: 50                       # notas semente do comando `zettel article`
    max_context_notes: 24
    max_chars_per_note: 5000
    max_hops: 4                    # expansao de grafo do article (≠ graph_expansion.max_hops)
    max_sections: 8                # teto de secoes no outline
    max_figures: 6                 # teto de figuras no catalogo
    chars_per_section_draft: 2500  # alvo de tamanho por secao no prompt de draft
    personalities_path: ./config/personalities.yaml
    default_personality: neutral   # neutral = nao reescreve via LLM
    enrich_query_count: 6          # queries extras geradas no enricher
    max_judge_iterations: 3        # ciclos draft ↔ judge
    judge_min_score: 7.0           # media minima para APPROVED
    writer_temperature: null       # null = usa llm.temperature nas secoes
    judge_temperature: 0.2
    enrich_temperature: 0.2
  catalog:
    note_topk: 20                  # sementes de nota (sinal A) do `zettel catalog`
    summary_topk: 20               # sementes de resumo de capitulo (sinal B)
    max_sources: 10                # fontes listadas na tabela
    max_chapters_per_source: 8     # capitulos mostrados por fonte

# ── Resumos de capitulo e de fonte (ADR-047) ───────────────────────────
# `zettel summarize` resume cada capitulo a partir do texto real dos chunks e
# reduz os resumos de capitulo em um resumo geral da fonte. Regenera so quando
# `chapter_checksum` mudou, entao rodar de novo em vault estavel nao custa nada.
summarize:
  max_input_chars: 60000           # acima disso o capitulo vai por map-reduce
  preflight_output_tokens_per_chapter: 600  # alvo do estimador, nao teto do modelo
  max_topics: 8                    # termos-chave por resumo

# ── Camada de decisao tipada (TypeSafe Jev, ADR-055) ───────────────────
# O Jev responde perguntas tipadas (choice/score/noul) com probabilidade, sem
# gerar texto. Hoje so em modo shadow: roda ao lado da decisao atual e grava o
# veredito em `decision_shadow` (state.db), sem mudar nada. Credencial:
# TYPESAFE_API_KEY no .env. Relatorio: scripts/report_decision_shadow.py.
decision:
  provider: typesafe
  model: jev-1.13.0                # fixo, nunca jev-latest
  base_url: null                   # null = endpoint publico
  timeout_s: 10.0
  max_retries: 2
  order_permutations: 3            # copias de cada choice com ordem rotacionada
  instructions_language: en        # en | pt -- decidido pela sonda de #206
  input_price_per_mtok: 0.042      # US$ por milhao de tokens de entrada
  corroborates_band_min: 0.50      # cosseno; era 0.75 na escala (1+cos)/2 (#208, ADR-058)
  sites:                           # off | shadow
    dedupe: shadow                 # dedupe da mesma fonte (review)
    moc_category: shadow           # categoria do cluster (garden)
    article_judge: shadow          # notas do juiz (article)
    corroborates: shadow           # mesma ideia entre obras (connect)

# ── Interface web ───────────────────────────────────────────────────────
web:
  job_retention_days: 90       # jobs encerrados mais antigos saem na subida; 0 guarda todos
  article_pause_ttl_hours: 24  # pausa de artigo sem decisão é liberada depois disto; 0 nunca expira

# ── Idioma dos prompts / texto gerado ──────────────────────────────────
language: pt-BR

# Fuso IANA para created_at/updated_at no vault e exibição na web (SQLite permanece UTC).
vault_timezone: America/Sao_Paulo

# ── Logging (raiz do pipeline; httpx/openai ficam em WARNING) ──────────
log_level: INFO

# ── Dispositivo (Docling + sentence-transformers) ──────────────────────
device: cuda                 # auto | cpu | cuda
