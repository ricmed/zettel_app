          - "Validação de Outputs"

  - pilar: "Domínios de Negócio, Gestão e Verticais"
    categorias:
      - nome: "Operação e Times"
        topicos:
          - "Gestão de Projetos de Dados"
          - "Metodologias Ágeis"
          - "Estrutura de Equipes"
      - nome: "Produtos de Dados"
        topicos:
          - "Ciclo de Vida do Produto"
          - "Tomada de Decisão"
          - "Estratégia de Dados"
      - nome: "Casos de Uso por Vertical"
        topicos:
          - "Detecção de Fraudes"
          - "Credit Scoring"
          - "Saúde Pública"
          - "Saúde Suplementar"
