# Few-shots de dominio para extract (Prompt 1) e connect (Prompt 2).
# Um arquivo so, com os dois dominios lado a lado: um "nivel 5" de ML ao
# lado de um "nivel 5" de Filosofia ensina que a escala mede densidade
# conceitual, nao proximidade com um campo.
# Consumido por zettel/domain_examples.py. Caminho: domain.examples_path.

literature_note:
  relevance_examples: |
    **Exemplos (os dois dominios medem a mesma densidade, nao a proximidade com um campo):**

    1 — TRIVIAL
    - Ciencia de Dados: "Aprendizado de maquina e usado em inteligencia artificial"
    - Filosofia: "Conhecimento e uma crenca verdadeira"

    2 — INFORMATIVO BASICO
    - Ciencia de Dados: "Redes neurais organizam unidades de processamento em camadas"
    - Filosofia: "Platao distingue opiniao (doxa) de conhecimento (episteme)"

    3 — CONCEITO TECNICO VALIDO
    - Ciencia de Dados: "Normalizar ativações por lote reduz o deslocamento interno da distribuicao durante o treino"
    - Filosofia: "A justificacao epistemica exige razoes que o proprio sujeito possa reconhecer"

    4 — INSIGHT RELEVANTE
    - Ciencia de Dados: "Desligar unidades ao acaso no treino funciona como um ensemble implicito de sub-redes"
    - Filosofia: "O ceticismo cartesiano nao nega o mundo: suspende o assentimento ate achar um criterio de certeza"

    5 — CONCEITO FUNDAMENTAL (raro)
    - Ciencia de Dados: "Atencao permite modelar dependencias de longo alcance sem recorrencia"
    - Filosofia: "O schematismo kantiano e a regra pela qual a imaginacao subsume intuicoes sob categorias"

  thesis_examples: |
    - **BOM** (Ciencia de Dados): "Regularizacao L1 induz esparsidade nos pesos ao adicionar penalidade proporcional ao valor absoluto"
    - **BOM** (Filosofia): "Uma crenca justificada ainda pode falhar como conhecimento se a justificacao nao estiver conectada ao fato que a torna verdadeira"
    - **RUIM**: "Regularizacao L1" (e topico, nao tese)
    - **RUIM**: "O problema de Gettier" (e nome de debate, nao afirmação)

  judgement_examples: |
    #### Regras de Decisao (decision_rules) — opcional

    - So preencha quando o trecho **enunciar** a regra; jamais deduza uma a partir da tese
    - Formato: "Quando X, faca Y, porque Z" (no idioma da nota)
    - Maximo 3 itens; cada item e uma frase completa e autonoma
    - **BOM** (Ciencia de Dados): "Quando o custo de um falso positivo for maior que o de um falso negativo, prefira precisao a revocacao, porque o erro caro e a inclusao indevida"
    - **BOM** (Filosofia): "Quando uma crenca for verdadeira so por acaso, recuse chama-la de conhecimento, porque falta conexao entre justificacao e fato"
    - **RUIM**: "Use precisao e revocacao" (nao e regra: nao diz quando nem por que)
    - **RUIM**: inventar "Quando o corpus for pequeno, use validacao cruzada" porque parece razoavel — se o autor nao disse, nao entra

    #### Anti-Padroes (anti_patterns) — opcional

    - So preencha quando o trecho nomear a pratica errada **e** o motivo da falha
    - Formato: "O que evitar: ... — por que falha: ..."
    - Maximo 3 itens
    - **BOM** (Ciencia de Dados): "O que evitar: avaliar o modelo no mesmo conjunto usado para escolher hiperparametros — por que falha: a estimativa de erro passa a incluir a informacao ja usada na selecao"
    - **BOM** (Filosofia): "O que evitar: tratar 'parece-me verdadeiro' como justificacao — por que falha: a fenomenologia do assentimento nao distingue crenca de conhecimento"
    - **RUIM**: "Evite sobreajuste" (generico, sem mecanismo de falha)
    - **Nao duplique `limits`**: uma ressalva sobre quando a tese nao vale e `limits`; anti-padrao e uma **pratica** que alguem executa e que falha

    #### Frameworks Nomeados (named_frameworks) — opcional

    - Apenas nomes proprios que o autor **usa como nome**: "The 5 Whys", "OODA Loop", "Conway's Law", "OODA", "Gettier cases"
    - Preserve o nome **exatamente** como esta na fonte, na lingua original — nao traduza, nao expanda a sigla, nao normalize maiusculas
    - Maximo 3 itens; so o nome, sem explicacao (a explicacao ja esta na definicao)
    - **BOM**: `["The 5 Whys"]`, `["OODA Loop"]`
    - **RUIM**: `["Os 5 Porques"]` (traduzido), `["The 5 Whys — tecnica de analise de causa raiz"]` (nao e so o nome)
    - **RUIM**: `["aprendizado supervisionado"]` ou `["dualismo"]` (termo de dominio, nao nome proprio de framework)

  tag_examples: |
    - 2-5 tags por candidato
    - Minusculas, sem acentos
    - Tags compostas: palavra1_palavra2
    - Exija **pelo menos uma tag estrutural/transferivel** (o conceito que a nota instancia, nao o vocabulario do campo) ao lado das especificas
    - Transferivel (boa): `dualismo`, `emergencia`, `intencionalidade`, `representacao`, `justificacao`, `esparsidade`
    - Generica (ruim): `importante`, `tecnica`, `filosofia`, `ciencia_de_dados`
    - **BOM** (Ciencia de Dados): `["descida_gradiente", "otimizacao", "convergencia"]` — especifica + transferivel
    - **BOM** (Filosofia): `["res_cogitans", "substancia", "dualismo"]` — especifica + transferivel
    - **RUIM**: `["importante", "tecnica"]` (genericas) ou so jargao de um campo sem ponte (`["batch_norm"]` sozinho)

  rejection_examples: |
    **REJEITADO - Structural:**
    ```
    Input: "Capitulo 3: Arquiteturas ... 3.1 Introducao ... 3.2 Componentes ... 3.3 Treinamento ..."
    Reason: "Indice de capitulo sem conteudo conceitual"
    Category: structural
    ```

    **REJEITADO - Narrative:**
    ```
    Input: "Neste capitulo, exploraremos ideias que mudarao sua pratica e iluminarao o debate..."
    Reason: "Preambulo introdutorio generico sem conceitos especificos"
    Category: narrative
    ```

    **REJEITADO - Narrative (ficcao sem principio):**
    ```
    Input: "Ela caminhou ate a estacao, pensando no que diria ao chefe. O trem atrasou dez minutos e ela ficou olhando as pessoas ao redor, ansiosa."
    Reason: "Cena cotidiana sem principio extraivel — nenhum mecanismo, regra ou tensao conceitual sustenta a passagem"
    Category: narrative
    ```

    **REJEITADO - Promotional:**
    ```
    Input: "A plataforma oferece APIs intuitivas, execucao imediata e integracao com o ecossistema popular..."
    Reason: "Descricao de features de produto sem conceito tecnico subjacente"
    Category: promotional
    ```

    **REJEITADO - Trivial:**
    ```
    Input: "Inteligencia artificial e o campo que estuda como fazer maquinas inteligentes. E muito importante hoje em dia."
    Reason: "Definicao generica de dicionario sem densidade conceitual"
    Category: trivial
    ```

    **REJEITADO - Fragmented:**
    ```
    Input: uma tabela de silogismos sem glosa; uma formula em notacao logica sem interpretacao; uma citacao em grego sem traducao; um bloco de codigo sem comentario conceitual
    Reason: "Fragmento sem interpretacao — notacao, codigo ou citacao crua nao instanciam um conceito"
    Category: fragmented
    ```

