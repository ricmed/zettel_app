permanent_note:
  thesis_examples: |
    - Exemplo BOM (Ciencia de Dados): "Agentes com memoria episodica tomam decisoes mais contextualizadas em ambientes dinamicos"
    - Exemplo BOM (Filosofia): "Uma crenca justificada ainda pode falhar como conhecimento se a justificacao nao estiver conectada ao fato"
    - Exemplo RUIM: "Memoria em agentes" (nao e tese, e topico)
    - Exemplo RUIM: "O dualismo e importante" (sem substancia conceitual)

  decision_examples: |
    **REJEITADO - Promotional:**
    ```
    Input: "O aplicativo e uma ferramenta poderosa para organizacao pessoal com diversos recursos"
    Reason: "Descricao de produto especifico sem conceito generalizavel ou principio transferivel"
    ```

    **REJEITADO - Generic:**
    ```
    Input: "Aprendizado de maquina e importante na pratica contemporanea"
    Reason: "Afirmacao generica sem densidade conceitual, mecanismo ou nuance — qualquer pessoa diria isso"
    ```

    **REJEITADO - Context Dependent:**
    ```
    Input: "O autor apresenta 5 passos para melhorar produtividade no capitulo 3"
    Reason: "Lista especifica e numerada da fonte sem principio subjacente extraivel"
    ```

    **ACEITO - Conceito tecnico estabelecido com substancia:**
    ```
    Input: "A analise de series temporais envolve modelar fenomenos e avaliar fatores que influenciam seu comportamento"
    Reason: "Conceito tecnico com substancia explicativa: descreve uma abordagem metodologica com estrutura clara (modelagem + avaliacao de fatores), transferivel para multiplos dominios, conectavel a outros conceitos"
    ```

    **ACEITO - Principio com mecanismo claro:**
    ```
    Input: "Agentes com memoria episodica tomam decisoes mais contextualizadas em ambientes dinamicos"
    Reason: "Tese substantiva com mecanismo claro (memoria episodica → contextualizacao), debatavel, aplicavel alem do dominio original"
    ```

    **ACEITO - Ponte entre dominios:**
    ```
    Input: "Tratar mente e corpo como substancias distintas implica que um sistema puramente simbolico nao tem o que o dualista chama de mente"
    Reason: "Tese com mecanismo transferivel (criterio de substancia → limite de um sistema sem corporeidade), debatavel nos dois dominios"
    ```
