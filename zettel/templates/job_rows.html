{% if jobs %}<div class="table-wrap"><table><thead><tr><th>Operação</th><th>Estado</th><th>Fase</th><th>Mensagem</th><th>Quando</th></tr></thead><tbody>{% for job in jobs %}<tr><td><a href="/jobs/{{ job.job_id }}">{{ job.operation }}</a></td><td><span class="status {{ job.state }}">{{ job.state }}</span></td><td>{{ job.phase }}</td><td>{{ job.message }}</td><td>{{ job.created_at | local_dt('datetime') }}</td></tr>{% endfor %}</tbody></table></div>{% else %}<div class="empty">Nenhuma execução registrada ainda.</div>{% endif %}
