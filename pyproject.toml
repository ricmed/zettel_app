[project]
name = "zettel-app"
version = "0.7.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb==1.5.9",
    "docling==2.123.1",
    "hdbscan==0.8.44",
    "hf-xet==1.2.0",
    "langchain-core>=1.2.7",
    "langchain-openai>=1.1.7",
    "langchain-text-splitters>=1.1.0",
    "langgraph>=0.2.0",
    "openai>=2.16.0",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.1",
    "python-ulid>=3.1.0",
    "pyyaml>=6.0.3",
    "rich>=14.3.2",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.8.0",
    "typer>=0.21.1",
    "typer-slim==0.21.1",
    "ulid>=1.1",
    "umap-learn==0.5.12",
    "torch>=2.10.0; sys_platform == 'win32' or sys_platform == 'linux'",
    "torchvision>=0.25.0; sys_platform == 'win32' or sys_platform == 'linux'",
    "langchain-ollama>=1.0.1",
    "litellm>=1.95.0",
    "linkify-it-py>=2.2.0",
    "markdown-it-py>=4.2.0",
    "ruff>=0.16.5",
    "langchain-chroma>=1.1.0",
    "langchain-google-genai>=4.3.7",
    "typesafe-sdk>=0.7.2",
    "nh3>=0.3",
    "joblib>=1.6.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]


[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Strict: a misspelt marker or ini key is an error, not a silent new name.
addopts = "--strict-markers --strict-config -ra"
markers = [
  "slow: needs UMAP/numba, Docling, scikit-learn or a subprocess; skip with -m 'not slow'",
]
# A hung lock or worker fails the test instead of holding CI for the job's hour.
timeout = 300
filterwarnings = [
  # A deprecation reached through our own code breaks the suite the day it lands.
  "error::DeprecationWarning:zettel",
  "error::PendingDeprecationWarning:zettel",
  # umap says it runs single-threaded because the garden seeds it (#294), by design.
  "ignore:n_jobs value 1 overridden to 1 by setting random_state:UserWarning:umap",
]

[tool.coverage.run]
source = ["zettel"]
branch = true

[tool.coverage.report]
# Measured total (lines + branches) rounded down: 79.63% at #326, 80.32% after #329,
# 84.57% after #330. Raise it when coverage grows; never lower it to make a change pass.
fail_under = 84
skip_covered = true
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["zettel", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
  "BLE",
  "DTZ",
  "PIE",
  "PLR",
  "S",
  "TRY",
  "C4",
  "ISC",
]
# Regras ruidosas em codigo legado — corrija incrementalmente nos arquivos que tocar.
ignore = [
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR0917",
  "PLR2004",
  "TRY003",
  "TRY300",
  "TRY301",
  "TRY400",
  "S608",
  "BLE001",
  "SIM102",
  "S110",
  "S112",
  "B904",
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S603", "S108", "TRY002", "E402"]
"zettel/cli/**/*.py" = ["B008"]
"zettel/web/**/*.py" = ["B008"]
"zettel/article_graph/**/*.py" = ["S101"]
"zettel/evals/manifest.py" = ["S607"]
# git on the CI checkout, arguments built by the module itself (#333).
"zettel/evals/measurement_map.py" = ["S603", "S607"]
"tests/evals/test_measurement_map.py" = ["S607"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "hypothesis>=6.170.5",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
]
